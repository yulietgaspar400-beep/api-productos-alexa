services:
  - type: web
    name: api-productos-alexa
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-productos-db
          property: connectionString
      - key: API_KEY
        generateValue: true

databases:
  - name: api-productos-db
    plan: free
    databaseName: productos
    user: productos_user
    postgresMajorVersion: "17"
